{{template "base" .}}

{{define "content"}}
{{if not .SpotifyLinked}}
<div class="banner-warning">
  Your Spotify account isn't connected yet.
  <a href="/spotify/connect" class="btn btn-sm btn-spotify">Connect Spotify</a>
</div>
{{end}}

<div class="layout">
  <!-- ── Form ── -->
  <section class="form-panel">
    <h2>Build a playlist</h2>

    <form id="run-form">
      <!-- Mode selector -->
      <fieldset class="mode-tabs">
        <legend class="sr-only">Mode</legend>
        <label class="mode-tab">
          <input type="radio" name="mode" value="sonic" checked onchange="switchMode(this.value)"> Sonic
          <span class="info-icon" data-tip="Describe a mood, vibe, or style and let the AI find matching tracks by audio similarity." tabindex="0" aria-label="More info">?</span>
        </label>
        <label class="mode-tab">
          <input type="radio" name="mode" value="connection" onchange="switchMode(this.value)"> Connection
          <span class="info-icon" data-tip="Explore an artist's network — fans, collaborators, and influences — and build a playlist from their constellation." tabindex="0" aria-label="More info">?</span>
        </label>
        <label class="mode-tab">
          <input type="radio" name="mode" value="dna" onchange="switchMode(this.value)"> DNA
          <span class="info-icon" data-tip="Map a track's sample DNA — every track it sampled, every track that sampled it, and any melodic interpolations." tabindex="0" aria-label="More info">?</span>
        </label>
        <label class="mode-tab">
          <input type="radio" name="mode" value="rediscovery" onchange="switchMode(this.value)"> Rediscovery
          <span class="info-icon" data-tip="Build a playlist from tracks you used to love but haven't played recently." tabindex="0" aria-label="More info">?</span>
        </label>
      </fieldset>

      <!-- Sonic fields -->
      <div id="fields-sonic" class="mode-fields">
        <label for="prompt">Describe the playlist <span class="info-icon" data-tip="Natural language description of the sound you want — mood, genre, activity, or vibe." tabindex="0" aria-label="More info">?</span></label>
        <input id="prompt" name="prompt" type="text"
               placeholder="dark ambient for late-night coding" autocomplete="off">
      </div>

      <!-- Connection fields -->
      <div id="fields-connection" class="mode-fields hidden">
        <label for="artist">Seed artist <span class="info-icon" data-tip="The artist to start from. The agent will explore their collaborators, influences, and fans to build a constellation playlist." tabindex="0" aria-label="More info">?</span></label>
        <input id="artist" name="artist" type="text" placeholder="Nine Inch Nails" autocomplete="off">
        <div class="row">
          <label class="checkbox-label">
            <input type="checkbox" name="new_only"> Discoveries only <span class="info-icon" data-tip="Prefer artists not already in your Spotify listening history — great for finding new music." tabindex="0" aria-label="More info">?</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="match_sound"> Match sound <span class="info-icon" data-tip="Also filter results by audio similarity to the seed artist's sound, not just graph connections." tabindex="0" aria-label="More info">?</span>
          </label>
        </div>
        <label for="depth">Graph depth <span class="info-icon" data-tip="How many hops away from the seed artist to explore. 2 = friends of friends. Higher values find more obscure connections but take longer." tabindex="0" aria-label="More info">?</span></label>
        <input id="depth" name="depth" type="number" value="2" min="1" max="4">
      </div>

      <!-- DNA fields -->
      <div id="fields-dna" class="mode-fields hidden">
        <label for="dna_track">Track <span class="info-icon" data-tip="The track to deep-dive. The agent will find every sample it contains, every track that sampled it, and any melodic interpolations." tabindex="0" aria-label="More info">?</span></label>
        <input id="dna_track" name="dna_track" type="text"
               placeholder="Hurt" autocomplete="off">
        <label for="dna_artist">Artist <span class="muted">(optional)</span> <span class="info-icon" data-tip="Disambiguates tracks with common names — e.g. 'Hurt' exists by Nine Inch Nails and Johnny Cash. Leave blank if the track name is unique." tabindex="0" aria-label="More info">?</span></label>
        <input id="dna_artist" name="dna_artist" type="text"
               placeholder="Nine Inch Nails" autocomplete="off">
      </div>

      <!-- Rediscovery fields -->
      <div id="fields-rediscovery" class="mode-fields hidden">
        <label for="stale_days">Unplayed for at least (days) <span class="info-icon" data-tip="Tracks not played for this many days are considered forgotten." tabindex="0" aria-label="More info">?</span></label>
        <input id="stale_days" name="stale_days" type="number" value="90" min="30" max="730">
        <label for="min_plays">Minimum past plays <span class="info-icon" data-tip="Only include tracks you played at least this many times — ensures you actually liked them." tabindex="0" aria-label="More info">?</span></label>
        <input id="min_plays" name="min_plays" type="number" value="3" min="1" max="20">
      </div>

      <!-- Shared filters -->
      <details class="filters">
        <summary>Filters <span class="muted">(optional)</span></summary>
        <div class="filter-grid">
          <div>
            <label for="count">Tracks <span class="info-icon" data-tip="Number of tracks to include in the final playlist (5–50)." tabindex="0" aria-label="More info">?</span></label>
            <input id="count" name="count" type="number" value="20" min="5" max="50">
          </div>
          <div>
            <label>Energy <span class="info-icon" data-tip="Audio energy from 0.0 (calm/quiet) to 1.0 (intense/loud)." tabindex="0" aria-label="More info">?</span></label>
            <div class="dual-range">
              <div class="dr-track"><div class="dr-fill" id="dr-energy-fill"></div></div>
              <input type="range" class="dr-thumb" id="energy_min" name="energy_min" min="0" max="100" value="0" step="5" oninput="syncDR('energy',0,100,100)">
              <input type="range" class="dr-thumb" id="energy_max" name="energy_max" min="0" max="100" value="100" step="5" oninput="syncDR('energy',0,100,100)">
              <div class="dr-vals"><span id="dr-energy-lo">0.00</span><span id="dr-energy-hi">1.00</span></div>
            </div>
          </div>
          <div>
            <label>Valence <span class="info-icon" data-tip="Emotional positivity from 0.0 (dark/sad) to 1.0 (bright/happy)." tabindex="0" aria-label="More info">?</span></label>
            <div class="dual-range">
              <div class="dr-track"><div class="dr-fill" id="dr-valence-fill"></div></div>
              <input type="range" class="dr-thumb" id="valence_min" name="valence_min" min="0" max="100" value="0" step="5" oninput="syncDR('valence',0,100,100)">
              <input type="range" class="dr-thumb" id="valence_max" name="valence_max" min="0" max="100" value="100" step="5" oninput="syncDR('valence',0,100,100)">
              <div class="dr-vals"><span id="dr-valence-lo">0.00</span><span id="dr-valence-hi">1.00</span></div>
            </div>
          </div>
          <div>
            <label>Tempo BPM <span class="info-icon" data-tip="Beats per minute. E.g. 120–140 for dance, 60–80 for ballads." tabindex="0" aria-label="More info">?</span></label>
            <div class="dual-range">
              <div class="dr-track"><div class="dr-fill" id="dr-tempo-fill"></div></div>
              <input type="range" class="dr-thumb" id="tempo_min" name="tempo_min" min="40" max="300" value="40" step="1" oninput="syncDR('tempo',40,300,0)">
              <input type="range" class="dr-thumb" id="tempo_max" name="tempo_max" min="40" max="300" value="300" step="1" oninput="syncDR('tempo',40,300,0)">
              <div class="dr-vals"><span id="dr-tempo-lo">40</span><span id="dr-tempo-hi">300</span></div>
            </div>
          </div>
        </div>
      </details>

      <button id="run-btn" type="submit" class="btn btn-primary btn-full"
              {{if not .SpotifyLinked}}disabled title="Connect Spotify first"{{end}}>
        Generate playlist
      </button>
      <button id="cancel-btn" type="button" class="btn btn-ghost btn-full" style="display:none" onclick="cancelRun()">Stop</button>
    </form>
  </section>

  <!-- ── Output pane ── -->
  <section class="output-panel">
    <div class="output-header">
      <span>Agent output</span>
      <button id="clear-btn" class="btn btn-sm btn-ghost" onclick="clearOutput()" style="display:none">Clear</button>
    </div>
    <div id="output" class="output-log" aria-live="polite">
      <span class="muted">Output will appear here once the agent starts…</span>
    </div>
  </section>
</div>

<!-- ── History ── -->
<div id="history-panel" class="history-panel hidden">
  <div class="history-header">
    <span>History</span>
    <button type="button" class="btn btn-sm btn-ghost" onclick="clearHistory()">Clear</button>
  </div>
  <div id="history-list"></div>
</div>

<script>
function switchMode(mode) {
  document.querySelectorAll('.mode-fields').forEach(el => el.classList.add('hidden'));
  document.getElementById('fields-' + mode).classList.remove('hidden');
  document.querySelector('.filters').classList.toggle('hidden', mode === 'dna' || mode === 'rediscovery');
}

function clearOutput() {
  const out = document.getElementById('output');
  out.innerHTML = '<span class="muted">Output will appear here once the agent starts…</span>';
  document.getElementById('clear-btn').style.display = 'none';
}

function syncDR(id, absMin, absMax, scale) {
  const lo = document.getElementById(id + '_min');
  const hi = document.getElementById(id + '_max');
  let loVal = parseInt(lo.value), hiVal = parseInt(hi.value);
  if (loVal > hiVal) { lo.value = loVal = hiVal; }
  const fill = document.getElementById('dr-' + id + '-fill');
  const pct = v => ((v - absMin) / (absMax - absMin)) * 100;
  fill.style.left = pct(loVal) + '%';
  fill.style.width = (pct(hiVal) - pct(loVal)) + '%';
  const loDisp = document.getElementById('dr-' + id + '-lo');
  const hiDisp = document.getElementById('dr-' + id + '-hi');
  if (loDisp) loDisp.textContent = scale ? (loVal / scale).toFixed(2) : loVal;
  if (hiDisp) hiDisp.textContent = scale ? (hiVal / scale).toFixed(2) : hiVal;
}

syncDR('energy', 0, 100, 100);
syncDR('valence', 0, 100, 100);
syncDR('tempo', 40, 300, 0);

let activeSource = null;
let currentRunId = null;

document.getElementById('run-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (activeSource) { activeSource.close(); activeSource = null; }

  const btn = document.getElementById('run-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  btn.disabled = true; btn.textContent = 'Running…';
  cancelBtn.style.display = '';

  const out = document.getElementById('output');
  if (out.children.length > 0 && !out.querySelector('.muted')) {
    const sep = document.createElement('div');
    sep.className = 'run-separator';
    out.appendChild(sep);
  } else {
    out.innerHTML = '';
  }
  document.getElementById('clear-btn').style.display = 'none';

  const data = new FormData(e.target);
  const runLabel = _histLabel(data);
  const runLines = [];
  const eMin = parseInt(data.get('energy_min')||'0'), eMax = parseInt(data.get('energy_max')||'100');
  data.delete('energy_min'); data.delete('energy_max');
  if (eMin !== 0 || eMax !== 100) data.set('energy', (eMin/100).toFixed(2)+'-'+(eMax/100).toFixed(2));

  const vMin = parseInt(data.get('valence_min')||'0'), vMax = parseInt(data.get('valence_max')||'100');
  data.delete('valence_min'); data.delete('valence_max');
  if (vMin !== 0 || vMax !== 100) data.set('valence', (vMin/100).toFixed(2)+'-'+(vMax/100).toFixed(2));

  const tMin = parseInt(data.get('tempo_min')||'40'), tMax = parseInt(data.get('tempo_max')||'300');
  data.delete('tempo_min'); data.delete('tempo_max');
  if (tMin !== 40 || tMax !== 300) data.set('tempo', tMin+'-'+tMax);

  let resp;
  try {
    resp = await fetch('/run', { method: 'POST', body: new URLSearchParams(data) });
  } catch (err) {
    appendLine(out, '[error] Network error: ' + err.message, 'err');
    btn.disabled = false; btn.textContent = 'Generate playlist';
    cancelBtn.style.display = 'none'; return;
  }
  if (!resp.ok) {
    const msg = await resp.text();
    appendLine(out, '[error] ' + msg, 'err');
    btn.disabled = false; btn.textContent = 'Generate playlist';
    cancelBtn.style.display = 'none'; return;
  }

  const { runId } = await resp.json();
  currentRunId = runId;
  const es = new EventSource('/stream/' + runId);
  activeSource = es;

  es.onmessage = (ev) => {
    const line = ev.data;
    runLines.push(line);
    if (line.startsWith('->')) appendLine(out, line, 'tool-call');
    else if (line.startsWith('  <-')) appendLine(out, line, 'tool-result');
    else if (line.startsWith('[error]')) appendLine(out, line, 'err');
    else appendLine(out, line, '');
    out.scrollTop = out.scrollHeight;
  };

  const onDone = () => {
    es.close(); activeSource = null; currentRunId = null;
    btn.disabled = false; btn.textContent = 'Generate playlist';
    cancelBtn.style.display = 'none';
    document.getElementById('clear-btn').style.display = '';
    _saveHistory(runLabel, runLines);
  };
  es.addEventListener('done', onDone);
  es.onerror = onDone;
});

async function cancelRun() {
  if (!currentRunId) return;
  await fetch('/run/' + currentRunId, { method: 'DELETE' }).catch(() => {});
}

// ── History ──────────────────────────────────────────────────────────────────
const _HIST_KEY = 'spotaify-history';
const _HIST_MAX = 5;

function _histLabel(data) {
  const mode = data.get('mode');
  if (mode === 'dna') return `DNA: "${data.get('dna_track') || ''}"`;
  if (mode === 'connection') return `Connection: "${data.get('artist') || ''}"`;
  const p = (data.get('prompt') || '').trim();
  return p ? `Sonic: "${p}"` : 'Sonic run';
}

function _saveHistory(label, lines) {
  try {
    const runs = JSON.parse(localStorage.getItem(_HIST_KEY) || '[]');
    runs.unshift({ ts: new Date().toISOString(), label, lines: lines.slice(0, 100) });
    if (runs.length > _HIST_MAX) runs.length = _HIST_MAX;
    localStorage.setItem(_HIST_KEY, JSON.stringify(runs));
  } catch(e) {}
  _renderHistory();
}

function clearHistory() {
  localStorage.removeItem(_HIST_KEY);
  _renderHistory();
}

function _renderHistory() {
  const runs = JSON.parse(localStorage.getItem(_HIST_KEY) || '[]');
  const panel = document.getElementById('history-panel');
  const list = document.getElementById('history-list');
  panel.classList.toggle('hidden', runs.length === 0);
  list.innerHTML = '';
  runs.forEach(run => {
    const m = (run.lines || []).find(l => /Done — https?:\/\//.test(l));
    const url = m ? m.match(/https?:\/\/\S+/)[0] : null;
    const d = document.createElement('details');
    d.className = 'history-item';
    const s = document.createElement('summary');
    s.className = 'history-summary';
    s.innerHTML = `<span class="history-time">${new Date(run.ts).toLocaleString()}</span>` +
                  `<span class="history-label">${run.label}</span>` +
                  (url ? `<a href="${url}" target="_blank" rel="noopener" class="playlist-link history-link" onclick="event.stopPropagation()">Open playlist</a>` : '');
    const c = document.createElement('div');
    c.className = 'history-content output-log';
    (run.lines || []).forEach(line => {
      const el = document.createElement('div');
      el.className = 'log-line' + (line.startsWith('->') ? ' tool-call' : line.startsWith('  <-') ? ' tool-result' : line.startsWith('[error]') ? ' err' : '');
      el.textContent = line;
      c.appendChild(el);
    });
    d.appendChild(s); d.appendChild(c);
    list.appendChild(d);
  });
}

_renderHistory();

function appendLine(container, text, cls) {
  const el = document.createElement('div');
  el.className = 'log-line' + (cls ? ' ' + cls : '');
  const m = text.match(/(Done — )(https?:\/\/\S+)/);
  if (m) {
    el.appendChild(document.createTextNode(m[1]));
    const a = document.createElement('a');
    a.href = m[2]; a.textContent = 'Open playlist';
    a.target = '_blank'; a.rel = 'noopener'; a.className = 'playlist-link';
    el.appendChild(a);
  } else {
    el.textContent = text;
  }
  container.appendChild(el);
}
</script>
{{end}}
