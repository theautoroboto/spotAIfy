[project]
name = "spotaify"
version = "0.1.0"
description = "AI-powered playlist curator using Claude + Spotify"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "cloudscraper>=1.2.71",
    "curl-cffi>=0.7.0",
    "musicbrainzngs>=0.7.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "spotipy>=2.23.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
spotaify = "spotaify.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
