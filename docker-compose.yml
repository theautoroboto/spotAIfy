services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - spotaify-data:/data
      - ./data/history:/data/history:ro
      # Persist API result caches (genius, whosampled) across container
      # rebuilds and share them with host CLI runs.
      - ./data/cache:/app/data/cache
    environment:
      DB_PATH: /data/spotaify.db
      GRAPH_DIR: /data/graph
      HISTORY_DIR: /data/history
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  spotaify-data:
  caddy-data:
  caddy-config:
